<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
</head>
<body>
  <h2>Iniciar sesión</h2>
  <button id="btnGoogle">Iniciar sesión con Google</button>
  <script src="Script.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAqTAcwFRUIrM98F0st6Jgc4bv0Ifsl5G0",
      authDomain: "simon-a08e7.firebaseapp.com",
      projectId: "simon-a08e7",
      storageBucket: "simon-a08e7.firebasestorage.app",
      messagingSenderId: "268766570742",
      appId: "1:268766570742:web:361d8413bb37b308e2e4d7",
      measurementId: "G-1BYVZJNX3T"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    const db = getFirestore(app);

    const btnGoogle = document.getElementById("btnGoogle");

    btnGoogle.addEventListener("click", async () => {
      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;

        await setDoc(
          doc(db, "usuarios", user.uid),
          {
            nombre: user.displayName,
            correo: user.email
          },
          { merge: true }
        );

        alert("Login correcto: " + user.email);

        window.location.href = "Index.html";
      } catch (error) {
        console.error(error);
        alert("Error Firebase: " + error.code + " - " + error.message);
      }
    });
  </script>
</body>
</html>
